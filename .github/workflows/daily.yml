name: Daily embodied intelligence digest

on:
  workflow_dispatch:
  schedule:
    # arXiv announces at 20:00 US Eastern. 01:30 UTC = 09:30 Shanghai,
    # safely after the announcement in both daylight-saving and standard time.
    - cron: "30 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: embodied-daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: https://api.moonshot.cn/v1
      OPENAI_MODEL: kimi-k3.1-pro-highspeed
      ALLOW_INSECURE_API_BASE: ${{ vars.ALLOW_INSECURE_API_BASE }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      TIMEZONE: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SITE_URL: https://embodied-daily-news-d3bud9a1d4b7-1342147663.tcloudbaseapp.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Install screenshot browser
        run: python -m playwright install --with-deps chromium

      - name: Generate digest, screenshots, and display site
        run: python -m embodied_daily

      - name: Set up Node.js for CloudBase
        if: ${{ env.TCB_SECRET_ID != '' && env.TCB_SECRET_KEY != '' && env.TCB_ENV_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish display site to Tencent CloudBase
        if: ${{ env.TCB_SECRET_ID != '' && env.TCB_SECRET_KEY != '' && env.TCB_ENV_ID != '' }}
        run: |
          npm install --global @cloudbase/cli
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy ./dist / --env-id "$TCB_ENV_ID" --yes --retry-count 3 --concurrency 5

      - name: Verify Tencent CloudBase website
        if: ${{ env.TCB_SECRET_ID != '' && env.TCB_SECRET_KEY != '' && env.TCB_ENV_ID != '' }}
        run: |
          for attempt in $(seq 1 12); do
            cache_bust="$(date +%s)"
            if curl --fail --silent --show-error --max-time 20 \
              -H "Cache-Control: no-cache" \
              "${TCB_SITE_URL}/index.html?v=${cache_bust}" \
              --output /tmp/cloudbase-index.html \
              && curl --fail --silent --show-error --max-time 20 \
              -H "Cache-Control: no-cache" \
              "${TCB_SITE_URL}/data/latest.json?v=${cache_bust}" \
              --output /tmp/cloudbase-latest.json \
              && grep --quiet "具身智能日报" /tmp/cloudbase-index.html \
              && grep --quiet '"items"' /tmp/cloudbase-latest.json; then
              echo "CloudBase website is reachable and contains the current digest."
              exit 0
            fi
            echo "CloudBase CDN is not ready yet (attempt ${attempt}/12)."
            sleep 10
          done
          echo "CloudBase website verification failed after 12 attempts."
          exit 1

      - name: Archive generated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data/state.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: publish daily digest"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload display site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish display site
        id: deployment
        uses: actions/deploy-pages@v4
